# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.config/hypr/omarchy-default-looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, class:qemu


# GPU setup: this is an Optimus laptop. The eDP panel is wired to the Intel
# iGPU (card2) and the RTX 4070 has no connected output, so aquamarine already
# picks the iGPU as primary and composites there. The usual "NVIDIA env block"
# (GBM_BACKEND=nvidia-drm, __GLX_VENDOR_LIBRARY_NAME=nvidia,
# LIBVA_DRIVER_NAME=nvidia) is for NVIDIA-primary machines and only forced
# every desktop app onto the wrong driver, keeping the dGPU awake. Games go to
# the dGPU explicitly with `prime-run` / Steam launch options instead.

# NOTE 2026-08-05: an attempt to render on the iGPU only, via
#   env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:00:02.0-card
# made Hyprland die at startup with "CBackend::create() failed!", which left
# SDDM falling back to the greeter. The device path itself was valid, so the
# most likely cause is that `env =` here is applied too late for aquamarine,
# which reads AQ_DRM_DEVICES from the process environment during backend init.
# Unverified. If retried, export it before Hyprland starts (~/.config/uwsm/env)
# and test from a TTY first, with a way back in already in place.

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf


# Omarchy's steam.conf floats the main Steam window at a fixed 1100x700, which
# leaves it small on this panel. Tile it instead; the Friends List and the other
# small steam windows keep the upstream floating behaviour.
windowrule = float off, match:class steam, match:title ^Steam$

# Minecraft window rule
windowrule {
  name = remove-frame-drop
  match:class = "Minecraft\* 1.21.1"
  immediate = true
}

# Same treatment for Source-engine games (CS2 runs under Xwayland as "cs2")
windowrule {
  name = cs2-immediate
  match:class = "cs2"
  immediate = true
}
